<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Amazon Hybrid Recommendations</title>
  <link rel="stylesheet" href="cssd.css">
</head>
<body>
  <header>
    <h1>Recommended for You</h1>
    <p>Based on your browsing and purchase history</p>
  </header>

  <section class="recommendations">
    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product Image">
      <h2>Wireless Headphones</h2>
      <p>Based on your interest in audio gear</p>
      <button>View on Amazon</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product Image">
      <h2>Smartwatch</h2>
      <p>Users who bought headphones also liked this</p>
      <button>View on Amazon</button>
    </div>

    <div class="product-card">
      <img src="https://via.placeholder.com/150" alt="Product Image">
      <h2>Bluetooth Speaker</h2>
      <p>Similar to items in your wishlist</p>
      <button>View on Amazon</button>
    </div>
  </section>
</body>
</html>
