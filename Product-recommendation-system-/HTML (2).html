
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walmart Product Recommendation System</title>
  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Set a custom font for the entire page -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- Main container for the entire app -->
  <div class="min-h-screen">
    <!-- Header Section -->
    <header class="bg-blue-900 text-white text-center py-10 shadow-lg rounded-b-xl">
      <h1 class="text-4xl font-bold tracking-tight">Walmart Product Recommendation System</h1>
      <p class="mt-2 text-lg text-blue-200">Generate personalized product recommendations</p>
    </header>

    <!-- Main Content Area -->
    <main class="container mx-auto px-4 py-12 max-w-6xl">
      
      <!-- Interactive Recommender Section -->
      <section class="bg-white p-8 rounded-2xl shadow-lg mb-8">
        <h2 class="text-3xl font-bold text-blue-900 mb-6 border-b-2 border-blue-100 pb-3">Get Recommendations</h2>
        
        <!-- Input Form -->
        <form id="recommender-form" class="space-y-6">
          <div>
            <label for="query-input" class="block text-sm font-medium text-gray-700">Enter a product or category:</label>
            <input type="text" id="query-input" placeholder="e.g., 'Nail polish'" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition duration-150 ease-in-out">
          </div>

          <div>
            <label for="model-select" class="block text-sm font-medium text-gray-700">Select Recommendation Type:</label>
            <select id="model-select" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 transition duration-150 ease-in-out">
              <option value="content-based">Content-Based Recommendations</option>
              <option value="rating-based">Rating-Based Recommendations</option>
              <option value="hybrid">Hybrid Recommendations</option>
            </select>
          </div>
          
          <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md shadow-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
            Generate Recommendations
          </button>
        </form>

        <!-- Loading Indicator and Results Container -->
        <div id="loading-spinner" class="mt-8 text-center hidden">
          <div class="flex justify-center items-center">
            <svg class="animate-spin -ml-1 mr-3 h-8 w-8 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-blue-700 font-semibold">Generating recommendations...</span>
          </div>
        </div>

        <div id="results-container" class="mt-8">
          <!-- Recommendations table will be rendered here -->
        </div>

      </section>
    </main>

    <!-- Footer -->
    <footer class="bg-blue-900 text-white text-center py-6 rounded-t-xl mt-8">
      <p class="text-gray-300">&copy; 2025 Product Recommendation System</p>
    </footer>
  </div>

  <script src="Untitled-2.js" >
    
    </script>

</body>
</html>
